server {
    listen 443 ssl;
    server_name vinly.fun;

    ssl_certificate /etc/letsencrypt/live/vinly.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinly.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name www.vinly.fun;

    ssl_certificate /etc/letsencrypt/live/vinly.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinly.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://vinly.fun$request_uri;
}
