name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 test/integration.py
      - name: Build the release archive used by deployment
        run: |
          source deploy/release-files.sh
          mkdir -p "$RUNNER_TEMP/vinly-release"
          tar -czf "$RUNNER_TEMP/vinly-release.tar.gz" "${release_files[@]}"
          tar -xzf "$RUNNER_TEMP/vinly-release.tar.gz" -C "$RUNNER_TEMP/vinly-release"
          docker build -t vinly-ci "$RUNNER_TEMP/vinly-release"
