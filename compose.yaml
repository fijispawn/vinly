services:
  wine-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      SEED_DEMO: ${SEED_DEMO:-0}
      DEMO_HOST_PASSWORD: ${DEMO_HOST_PASSWORD:-}
      DEMO_ANNA_PASSWORD: ${DEMO_ANNA_PASSWORD:-}
      DEMO_MAX_PASSWORD: ${DEMO_MAX_PASSWORD:-}
      DEMO_CATALOG_PASSWORD: ${DEMO_CATALOG_PASSWORD:-}
    volumes:
      - wine_data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wine_data:
